name: build-apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Android SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/android-sdk
          key: android-sdk-platform35-bt35

      - name: Install Android SDK（platform 35 + build-tools 35.0.0）
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/android-sdk/cmdline-tools
          cd /tmp
          curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d ~/android-sdk/cmdline-tools
          mv ~/android-sdk/cmdline-tools/cmdline-tools ~/android-sdk/cmdline-tools/latest
          SDKMANAGER=~/android-sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --sdk_root=$HOME/android-sdk "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Inject build metadata（构建号 / commit 写入 BuildInfo.java）
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          export BUILD_NUM COMMIT
          python3 - <<'PY'
          import os
          p = "src/com/pvebuddy/android/BuildInfo.java"
          s = open(p).read()
          s = s.replace("public static final int BUILD_NUMBER = 0;",
                        f"public static final int BUILD_NUMBER = {os.environ['BUILD_NUM']};")
          s = s.replace('public static final String COMMIT_SHA = "dev";',
                        f'public static final String COMMIT_SHA = "{os.environ["COMMIT"]}";')
          open(p, "w").write(s)
          print(f"注入完成: build {os.environ['BUILD_NUM']} @ {os.environ['COMMIT']}")
          PY

      - name: Build APK
        env:
          ANDROID_SDK: $HOME/android-sdk
        run: |
          set -o pipefail
          ./build-apk.sh | tee build.log | tail -20
          # 归一化路径：runner 上 SDK 在 workspace 旁
          ls -lh dist/

      - name: 冒烟测试（mock PVE e2e，21 项）
        env:
          ANDROID_SDK: $HOME/android-sdk
        run: |
          export JAVA_HOME=${JAVA_HOME:-/usr/lib/jvm/temurin-17-jdk-amd64}
          # 测试用 org.json（Android 内置，JVM 需外置）
          curl -sL -o /tmp/org-json.jar https://repo1.maven.org/maven2/org/json/json/20231013/json-20231013.jar
          mkdir -p SmokeTests/build
          cp src/com/pvebuddy/android/core/PveClient.java src/com/pvebuddy/android/core/LocalScanner.java SmokeTests/build/
          # AppLogger 测试副本剥离 android 依赖
          python3 - <<'PY'
          import re
          s = open("src/com/pvebuddy/android/core/AppLogger.java").read()
          s = s.replace("import android.content.Context;\n\n", "")
          s = re.sub(r"    public void init\(Context ctx\) \{[\s\S]*?\n    \}\n", "", s, count=1)
          s = s.replace("    public File logFile() { return file; }\n\n", "")
          s = re.sub(r"import java\.io\.File;\n", "", s)
          s = s.replace("    private File file;\n", "")
          s = s.replace("""            if (logFile != null) {
                try {
                    logFile.write(String.format(Locale.US, "%s [%s] [%s] %s%n",
                            fmt.format(new Date(e.ts)), levelName(level), tag, message));
                    logFile.flush();
                } catch (Exception ignore) { }
            }
""", "")
          s = s.replace("""            if (logFile != null) {
                try { logFile.close(); } catch (Exception ignore) { }
                if (file != null && file.exists()) file.delete();
                try { logFile = new FileWriter(file, false); } catch (Exception ignore) { }
            }
""", "")
          open("SmokeTests/build/AppLogger.java", "w").write(s)
          PY
          javac -cp /tmp/org-json.jar -d SmokeTests/build SmokeTests/build/*.java SmokeTests/SmokeTest.java
          python3 SmokeTests/mock_pve.py &> /tmp/mock.log &
          for i in $(seq 1 20); do
            if curl -sk https://127.0.0.1:8006/ | grep -qi proxmox; then echo "mock ready"; break; fi
            sleep 0.5
          done
          java -cp SmokeTests/build:/tmp/org-json.jar SmokeTest | tee /tmp/smoke-report.txt
          exit ${PIPESTATUS[0]}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PVEBuddy-apk
          path: dist/*.apk
          retention-days: 30

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: /tmp/smoke-report.txt

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
